<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ValeriusBridge Demo</title><style>body{font:16px system-ui;background:#edf4f0;color:#173b30;margin:0}header{background:#123d32;color:white;padding:24px}main,nav{max-width:900px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:10px;margin:5px;border:1px solid #b7cfc3;border-radius:8px}button{background:#176348;color:white;cursor:pointer}section{background:white;padding:18px;margin:12px 0;border-radius:12px}label{display:block}small{color:#52685d}input,textarea{max-width:90%}h1{margin:0 0 8px}</style><header><h1>ValeriusBridge</h1>Product research workspace · Simulation only</header><nav><button onclick="switchRole('Admin')">Admin</button><button onclick="switchRole('Client')">Client</button><button onclick="switchRole('Customer')">Customer</button></nav><main id="app"></main><script>
let role='Admin',funds=15000,packages=[{name:'Water bottle usability study',price:300,reward:200,size:10,status:'Published'}],orders=[],paid=0,profile={name:'Demo Client',gst:'',address:'',state:'Delhi'};const app=document.getElementById('app'),money=n=>'₹'+n.toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),val=id=>document.getElementById(id).value;function switchRole(r){role=r;render()}function render(){let h='<h2>'+role+' dashboard</h2><section>Packages: '+packages.length+' · Tasks: '+orders.length+' · Simulated payouts: '+money(paid)+'</section>';if(role==='Client')h+='<section><h3>Client wallet: '+money(funds)+'</h3><button onclick="funds+=5000;render()">Add ₹5,000 demo funds</button><h3>Create research package</h3><label>Research name <input id="name"></label><label>Product cost <input id="price" type="number" min="0" value="300"></label><label>Reward <input id="reward" type="number" min="0" value="200"></label><label>Slots <select id="size"><option>10</option><option>25</option><option>50</option></select></label><button onclick="create()">Submit package</button><small>Commission ₹150 per slot (sample)</small></section><section><h3>Sample GST profile</h3><label>Legal name <input id="legal" value="'+esc(profile.name)+'"></label><label>GSTIN <input id="gst" value="'+esc(profile.gst)+'"></label><label>Billing address <input id="address" value="'+esc(profile.address)+'"></label><label>State <input id="state" value="'+esc(profile.state)+'"></label><button onclick="saveProfile()">Save profile</button></section>';packages.forEach((p,i)=>{if(role==='Customer'&&p.status!=='Published')return;h+='<section><b>'+esc(p.name)+'</b><p>'+p.status+' · '+p.size+' slots · Cost '+money(p.price)+' · Reward '+money(p.reward)+'</p>';if(role==='Admin'&&p.status==='Pending')h+='<button onclick="packages['+i+'].status=\'Published\';render()">Publish</button>';if(role==='Customer'&&!orders.some(o=>o.i===i)&&!orders.some(o=>['Accepted','Submitted'].includes(o.status)))h+='<button onclick="accept('+i+')">Accept task</button>';h+='</section>'});orders.forEach((o,i)=>{h+='<section><b>'+esc(packages[o.i].name)+'</b><p>'+o.status+' · Payable '+money(o.amount)+' · Paid '+money(o.paid)+'</p>';if(role==='Customer'&&o.status==='Accepted')h+='<textarea id="proof'+i+'" placeholder="Private research notes"></textarea><button onclick="submitProof('+i+')">Submit proof</button>';if(role==='Admin'&&o.status==='Submitted')h+='<p>'+esc(o.proof)+'</p><button onclick="orders['+i+'].status=\'Approved\';render()">Approve proof</button>';if(role==='Admin'&&o.status==='Approved')h+='<input id="pay'+i+'" type="number" value="'+(o.amount-o.paid)+'"><button onclick="pay('+i+')">Record demo payout</button>';h+='</section>'});app.innerHTML=h}function saveProfile(){profile={name:val('legal'),gst:val('gst'),address:val('address'),state:val('state')};render()}function create(){let name=val('name').trim(),price=Number(val('price')),reward=Number(val('reward')),size=Number(val('size')),total=(price+reward+150)*size;if(!name||!Number.isFinite(total)||price<0||reward<0||total>funds)return alert('Check details and funds');funds-=total;packages.push({name,price,reward,size,status:'Pending'});render()}function accept(i){let p=packages[i];orders.push({i,status:'Accepted',amount:p.price+p.reward,paid:0});render()}function submitProof(i){let proof=val('proof'+i).trim();if(!proof)return alert('Enter notes');orders[i].proof=proof;orders[i].status='Submitted';render()}function pay(i){let o=orders[i],n=Number(val('pay'+i));if(!(n>0&&n<=o.amount-o.paid))return alert('Invalid amount');o.paid+=n;paid+=n;if(o.paid===o.amount)o.status='Paid';render()}render();</script></html>
